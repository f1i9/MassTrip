name: Build and Deploy MASSTRIP Web App to Azure

on:
  push:
    branches:
      - azure  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Install frontend dependencies (root package.json)
      - name: Install frontend dependencies
        run: npm install

      # Build frontend (outputs dist/)
      - name: Build Vite frontend
        run: npm run build

      # Install backend dependencies (backend/package.json)
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
          cd ..

      # Prepare deployable folder
      - name: Prepare deployment folder
        run: |
          mkdir deploy
          cp -r backend/* deploy/
          cp -r dist deploy/
          echo "Deploy folder ready"

      # Zip for deployment
      - name: Zip artifact for deployment
        run: |
          cd deploy
          zip -r ../release.zip .
          cd ..

      # Upload artifact to next job
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Unzip artifact
        run: unzip release.zip

      - name: Deploy to Azure
        id: deploy-to-azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'masstrip-web'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
